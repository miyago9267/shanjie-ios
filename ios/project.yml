name: Shanjie
options:
  bundleIdPrefix: com.miyago
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: 3U48LHZNLX
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shanjie:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miyago.shanjie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 善解
    dependencies:
      - target: ShanjieKeyboard
        embed: true
  ShanjieKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 善解
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miyago.shanjie.keyboard
        OTHER_LDFLAGS: ["-framework", "Accelerate"]
    dependencies:
      - framework: build/ShanjieCore.xcframework
        embed: false
        link: true
    preBuildScripts:
      - name: Copy engine data
        script: '"$SRCROOT/scripts/copy-resources.sh"'
        basedOnDependencyAnalysis: false
